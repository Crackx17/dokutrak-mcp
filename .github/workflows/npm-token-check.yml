# Proves NPM_TOKEN is a live npm credential without ever printing it.
# Manual only. Delete once trusted publishing replaces the token.
name: npm-token-check
on:
  workflow_dispatch:
jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
